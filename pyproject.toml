[project]
name = "tinyfft"
version = "0.1.0"
description = "Fast and clean n-dimensional FFT for tinygrad"
readme = "README.md"
license = "MIT"
authors = [{ name = "Felix Zimmermann", email = "fzimmermann89@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["tinygrad>=0.14.0"]

[dependency-groups]
dev = ["numpy", "pytest", "pytest-xdist", "ruff", "mypy"]
bench = ["numpy", "torch", "nvidia-cuda-nvrtc-cu12==12.6.*"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
files = ["src/tinyfft"]
strict = true

[tool.ruff]
preview = true
target-version = "py311"
line-length = 150
indent-width = 2

[tool.ruff.lint]
select = ["F", "W", "E71", "E72", "E112", "E113", "E203", "E272", "E275", "E303", "E304", "E501", "E702", "E703", "E731", "I", "UP", "B", "RET", "SIM"]
ignore = ["E741"]
